      { question: "79. சக்தி நாடக சபாவிற்காக தமிழ் ஒளி எழுதிய \"சிற்பியின் கதை\" (அ) \"சிற்பியின் காசல்\" நாடகம் பின்னாளில் எந்த பெயரில் சிவாஜி கணேசனின் திரைப்படமாக வந்ததாகச் சொல்லப்படுகிறது?", options: ["A) வீரபாண்டிய கட்டபொம்மன்", "B) வணங்காமுடி", "C) கப்பலோட்டிய தமிழன்", "D) பாவை விளக்கு"], answer: 1 },

    // ==================== 3 விரல் தொடுதல் தடுப்பு ====================
    function preventThreeFingerTouch() {
      document.addEventListener('touchstart', function(e) {
        if (e.touches.length >= 3) {
          e.preventDefault();
          e.stopImmediatePropagation();
          alert("❌ 3 விரல் தொடுதல் அனுமதிக்கப்படவில்லை!\n\nதேர்வின் போது இது தடைசெய்யப்பட்டுள்ளது.");
          return false;
        }
      }, { passive: false });
    }
    // ============================================================
    function togglePassword() {
      const pwd = document.getElementById('password');
      const btn = pwd.parentElement.querySelector('button');
      if (pwd.type === "password") {
        pwd.type = "text"; btn.textContent = "🙈";
      } else {
        pwd.type = "password"; btn.textContent = "👁️";
      }
    }
    function handleLogin() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const errorEl = document.getElementById('login-error');
      if (USERS[username] && USERS[username].pass === password) {
        currentUser = { username, ...USERS[username] };
        errorEl.classList.add('hidden');
        document.getElementById('login-block').classList.add('hidden');
        if (username === "admin") {
          document.getElementById('admin-block').classList.remove('hidden');
          fetchAdminData();
        } else {
          checkPreviousAttempt();
        }
      } else {
        errorEl.classList.remove('hidden');
      }
    }
    function checkPreviousAttempt() {
      db.ref('quiz_results/' + currentUser.username).once('value', (snapshot) => {
        if (snapshot.exists()) {
          const data = snapshot.val();
          if (data.answers && Array.isArray(data.answers) && data.answers.some(a => a !== null && a !== undefined)) {
            let correct = 0;
            data.answers.forEach((ans, i) => {
              if (ans === questions[i].answer) correct++;
            });
            data.correct = correct;
            data.incorrect = 150 - correct;
            data.score = correct;
            showResult(data);
          } else {
            startNewQuiz();
          }
        } else {
          startNewQuiz();
        }
      });
    }
    function startNewQuiz() {
      document.getElementById('quiz-block').classList.remove('hidden');
      answers = new Array(150).fill(null);
      currentIndex = 0;
      timeLeft = 4200;
      preventMobileReload();
      preventThreeFingerTouch();
      startTimer();
      loadQuestion();
    }
    function startTimer() {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timeLeft--;
        const m = Math.floor(timeLeft / 60);
        const s = timeLeft % 60;
        document.getElementById('timer').textContent = `${m}:${s < 10 ? '0' : ''}${s}`;
        if (timeLeft <= 0) submitQuiz();
      }, 1000);
    }
    function loadQuestion() {
      const q = questions[currentIndex];
      document.getElementById('q-no').textContent = currentIndex + 1;
      const progressPercent = ((currentIndex) / 150) * 100;
      document.getElementById('progress-bar').style.width = `${progressPercent}%`;
      document.getElementById('question-text').textContent = q.question;
      const container = document.getElementById('options');
      container.innerHTML = '';
      q.options.forEach((opt, i) => {
        const div = document.createElement('div');
        div.className = `option p-6 rounded-2xl border cursor-pointer text-lg ${answers[currentIndex] === i ? 'selected' : ''}`;
        div.textContent = opt;
        div.onclick = () => {
          answers[currentIndex] = i;
          saveProgress();
          loadQuestion();
        };
        container.appendChild(div);
      });
      document.getElementById('next-btn').disabled = answers[currentIndex] === null;
    }
    function saveProgress() {
      if (!currentUser) return;
      db.ref('quiz_results/' + currentUser.username).update({
        name: currentUser.name,
        answers: answers,
        timestamp: new Date().toISOString()
      });
    }
    function nextQuestion() {
      if (answers[currentIndex] === null) {
        alert("⚠️ கேள்விக்கு ஒரு விடையைத் தேர்ந்தெடுக்கவும்!");
        return;
      }
      if (currentIndex < 149) {
        currentIndex++;
        loadQuestion();
      } else {
        submitQuiz();
      }
    }
    function submitQuiz() {
      clearInterval(timerInterval);
      let correct = 0;
      answers.forEach((ans, i) => {
        if (ans === questions[i].answer) correct++;
      });
      const totalTime = 4200;
      const usedSeconds = totalTime - timeLeft;
      const hours = Math.floor(usedSeconds / 3600);
      const minutes = Math.floor((usedSeconds % 3600) / 60);
      const seconds = usedSeconds % 60;
    const finalTime =
    (hours > 0 ? hours + ":" : "") +
    String(minutes).padStart(2, "0") + ":" +
    String(seconds).padStart(2, "0");
      const result = {
        name: currentUser.name,
        score: correct,
        correct: correct,
        incorrect: 150 - correct,
        timeTaken: finalTime,
        answers: answers,
        timestamp: new Date().toISOString()
      };
      db.ref('quiz_results/' + currentUser.username).set(result);
      showResult(result);
    }
    function showResult(res) {
      document.getElementById('quiz-block').classList.add('hidden');
      document.getElementById('result-block').classList.remove('hidden');
      document.getElementById('score-text').textContent = res.score ?? res.correct ?? 0;
      document.getElementById('correct-count').textContent = res.correct ?? 0;
      document.getElementById('wrong-count').textContent = res.incorrect ?? (150 - (res.correct ?? 0));
      document.getElementById('time-taken').textContent = res.timeTaken || "70:00";
    }
    function preventMobileReload() {
      const isMobile = /Android|iPhone|iPad|iPod|webOS|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
      if (!isMobile) return;
      document.addEventListener('keydown', e => {
        if ((e.ctrlKey && (e.key === 'r' || e.key === 'R')) || e.key === 'F5') {
          e.preventDefault();
          alert("❌ மொபைல் குரோமில் ரீலோட் செய்ய முடியாது!");
        }
      });
      history.pushState(null, null, location.href);
      window.addEventListener('popstate', () => {
        history.pushState(null, null, location.href);
        alert("❌ பின்னோக்கி செல்ல முடியாது!");
      });
    }
    function generateDetailedPDF(username, result) {
      const element = document.createElement('div');
      element.style.padding = '40px';
      element.style.fontFamily = "'Noto Sans Tamil', sans-serif";
      element.style.background = 'white';
      element.style.color = '#1f2937';
 
      let correctCount = 0;
      questions.forEach((q, i) => {
        const selected = result.answers ? result.answers[i] : null;
        if (selected === q.answer) correctCount++;
      });
      const incorrectCount = 150 - correctCount;
      let html = `
        <h1 style="text-align:center; color:#4f46e5; font-size:28px;">VIVEKANANDAR TNPSC CENTRE</h1>
        <h2 style="text-align:center; margin:20px 0;">திருக்குறள் முழு விடை மதிப்பாய்வு அறிக்கை</h2>
        <div style="background:#f8fafc; padding:25px; border-radius:16px; margin-bottom:30px;">
          <strong>மாணவர்:</strong> ${result.name} (${username})<br>
          <strong>மதிப்பெண்:</strong> ${correctCount}/150 | சரி: ${correctCount} | தவறு: ${incorrectCount} | நேரம்: ${result.timeTaken || '70:00'}
        </div>
      `;
      questions.forEach((q, i) => {
        const selected = result.answers ? result.answers[i] : null;
        const isCorrect = selected === q.answer;
        html += `
          <div style="margin-bottom:25px; padding:20px; border:2px solid ${isCorrect ? '#10b981' : '#ef4444'}; border-radius:12px;">
            <strong>${i+1}. ${q.question}</strong><br><br>
            <strong>மாணவர் விடை:</strong> ${selected !== null && selected !== undefined ? q.options[selected] : "—"}
            <span style="color:${isCorrect ? '#10b981' : '#ef4444'};"> ${isCorrect ? '✅' : '❌'}</span><br>
            ${!isCorrect ? `<strong style="color:#10b981">சரியான விடை:</strong> ${q.options[q.answer]}` : ''}
          </div>`;
      });
      element.innerHTML = html;
      const opt = { margin: 15, filename: `${result.name}_Thirukkural_Result.pdf`, image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4' }};
      html2pdf().set(opt).from(element).save();
    }
    function downloadUserResult() {
      db.ref('quiz_results/' + currentUser.username).once('value', (snapshot) => {
        if (snapshot.exists()) generateDetailedPDF(currentUser.username, snapshot.val());
      });
    }
    function downloadSingleAdminResult(username, result) {
      generateDetailedPDF(username, result);
    }
    function downloadAllResultsFullPDF() {
      db.ref('quiz_results').once('value', (snapshot) => {
        let allHTML = `<div style="font-family:'Noto Sans Tamil',sans-serif; padding:40px; color:#1f2937;">
          <h1 style="text-align:center; color:#4f46e5;">VIVEKANANDAR TNPSC CENTRE</h1>
          <h2 style="text-align:center;">திருக்குறள் - அனைத்து மாணவர்கள் முழு விவரம்</h2>`;
        snapshot.forEach((child) => {
          const res = child.val();
          let cCount = 0;
          questions.forEach((q, qi) => {
            if (res.answers && res.answers[qi] === q.answer) cCount++;
          });
          allHTML += `<div style="page-break-before:always; margin-top:40px;">
            <h3 style="color:#4f46e5;">${res.name} (${child.key}) - ${cCount}/150</h3>`;
          questions.forEach((q, i) => {
            const selected = res.answers ? res.answers[i] : null;
            const isCorrect = selected === q.answer;
            allHTML += `
              <div style="margin:20px 0; padding:18px; border:2px solid ${isCorrect ? '#10b981' : '#ef4444'}; border-radius:10px;">
                <strong>${i+1}. ${q.question}</strong><br><br>
                <strong>மாணவர் விடை:</strong> ${selected !== null && selected !== undefined ? q.options[selected] : "—"}
                <span style="color:${isCorrect ? '#10b981' : '#ef4444'};"> ${isCorrect ? '✅' : '❌'}</span><br>
                ${!isCorrect ? `<strong style="color:#10b981">சரியான விடை:</strong> ${q.options[q.answer]}` : ''}
              </div>`;
          });
        });
        allHTML += `</div>`;
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = allHTML;
        document.body.appendChild(tempDiv);
        const opt = { margin: 15, filename: 'Thirukkural_All_Users_Full_Details.pdf', html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4' }};
        html2pdf().set(opt).from(tempDiv).save().then(() => document.body.removeChild(tempDiv));
      });
    }
    function fetchAdminData() {
      const tbody = document.getElementById('admin-tbody');
      tbody.innerHTML = '';
      db.ref('quiz_results').once('value', (snapshot) => {
        let totalStudents = 0, totalScore = 0;
        snapshot.forEach((child) => {
          const res = child.val();
          totalStudents++;
     
          let correct = 0;
          if (res.answers) {
            res.answers.forEach((ans, qi) => {
              if (ans === questions[qi].answer) correct++;
            });
          }
          const incorrect = 150 - correct;
          totalScore += correct;
          const row = document.createElement('tr');
          row.className = "border-b border-white/10 hover:bg-white/10 cursor-pointer transition";
          row.innerHTML = `
            <td class="py-5 font-medium">${res.name}</td>
            <td class="py-5 text-indigo-300">${child.key}</td>
            <td class="text-center py-5 font-bold">${correct}/150</td>
            <td class="text-center py-5 text-emerald-400">${correct}</td>
            <td class="text-center py-5 text-rose-400">${incorrect}</td>
            <td class="text-center py-5 text-amber-300">${res.timeTaken || "70:00"}</td>
            <td class="text-center py-5">
              <button class="px-6 py-2 bg-blue-600 hover:bg-blue-500 rounded-xl text-sm font-medium shadow transition">📥 PDF</button>
            </td>
          `;
          tbody.appendChild(row);
          row.querySelector('button').addEventListener('click', (e) => {
            e.stopImmediatePropagation();
            downloadSingleAdminResult(child.key, res);
          });
        });
        const avg = totalStudents ? (totalScore / totalStudents).toFixed(1) : 0;
        document.getElementById('admin-stats').innerHTML = `
          <div class="bg-white/10 p-6 rounded-3xl text-center border border-white/10">
            <div class="text-5xl font-bold">${totalStudents}</div>
            <div class="text-sm text-indigo-300 mt-2">மொத்த மாணவர்கள்</div>
          </div>
          <div class="bg-white/10 p-6 rounded-3xl text-center border border-white/10">
            <div class="text-5xl font-bold">${avg}</div>
            <div class="text-sm text-indigo-300 mt-2">சராசரி மதிப்பெண்</div>
          </div>
        `;
      });
    }
  </script>
